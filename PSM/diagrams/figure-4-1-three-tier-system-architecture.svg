<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="740" viewBox="0 0 920 740" role="img" aria-label="QDTS Three-Tier System Architecture">
  <defs>
    <style>
      .tier-title { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #000; }
      .comp-title { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #000; text-anchor: middle; }
      .comp-desc { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #000; text-anchor: middle; }
      .actor { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #000; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #000; text-anchor: middle; }
      .tier { fill: #fff; stroke: #000; stroke-width: 1.3; }
      .comp { fill: #fff; stroke: #000; stroke-width: 1.1; }
      .db { fill: #fff; stroke: #000; stroke-width: 1.1; }
      .line { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
      .line-down { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>

  <g id="actors">
    <circle cx="300" cy="42" r="12" fill="#fff" stroke="#000" stroke-width="1.1"/>
    <line x1="300" y1="54" x2="300" y2="88" stroke="#000" stroke-width="1.1"/>
    <line x1="280" y1="68" x2="320" y2="68" stroke="#000" stroke-width="1.1"/>
    <line x1="300" y1="88" x2="285" y2="108" stroke="#000" stroke-width="1.1"/>
    <line x1="300" y1="88" x2="315" y2="108" stroke="#000" stroke-width="1.1"/>
    <text class="actor" x="300" y="126">Worker</text>

    <circle cx="620" cy="42" r="12" fill="#fff" stroke="#000" stroke-width="1.1"/>
    <line x1="620" y1="54" x2="620" y2="88" stroke="#000" stroke-width="1.1"/>
    <line x1="600" y1="68" x2="640" y2="68" stroke="#000" stroke-width="1.1"/>
    <line x1="620" y1="88" x2="605" y2="108" stroke="#000" stroke-width="1.1"/>
    <line x1="620" y1="88" x2="635" y2="108" stroke="#000" stroke-width="1.1"/>
    <text class="actor" x="620" y="126">Manager</text>
  </g>

  <line class="line" x1="300" y1="108" x2="380" y2="168"/>
  <line class="line" x1="620" y1="108" x2="540" y2="168"/>
  <text class="label" x="460" y="148">uses browser</text>

  <rect class="tier" x="120" y="155" width="680" height="95"/>
  <rect class="tier" x="120" y="155" width="200" height="22" fill="#fff"/>
  <text class="tier-title" x="130" y="170">Presentation Tier</text>

  <rect class="comp" x="280" y="188" width="18" height="50"/>
  <rect class="comp" x="298" y="188" width="340" height="50"/>
  <line x1="298" y1="188" x2="298" y2="238" stroke="#000" stroke-width="1.1"/>
  <text class="comp-title" x="468" y="208">React SPA</text>
  <text class="comp-desc" x="468" y="224">Pages and Components (Dashboard, Defects, Batches, Reports)</text>

  <line class="line-down" x1="460" y1="238" x2="460" y2="278"/>
  <text class="label" x="460" y="262">HTTP JSON REST API</text>

  <rect class="tier" x="120" y="280" width="680" height="300"/>
  <rect class="tier" x="120" y="280" width="200" height="22" fill="#fff"/>
  <text class="tier-title" x="130" y="295">Application Tier</text>

  <rect class="comp" x="300" y="310" width="18" height="44"/>
  <rect class="comp" x="318" y="310" width="304" height="44"/>
  <text class="comp-title" x="470" y="328">Routes</text>
  <text class="comp-desc" x="470" y="342">Define API endpoints and URL mappings</text>

  <line class="line-down" x1="470" y1="354" x2="470" y2="368"/>

  <rect class="comp" x="300" y="370" width="18" height="44"/>
  <rect class="comp" x="318" y="370" width="304" height="44"/>
  <text class="comp-title" x="470" y="388">Middleware</text>
  <text class="comp-desc" x="470" y="402">JWT Authentication, File Upload Handling</text>

  <line class="line-down" x1="470" y1="414" x2="470" y2="428"/>

  <rect class="comp" x="300" y="430" width="18" height="44"/>
  <rect class="comp" x="318" y="430" width="304" height="44"/>
  <text class="comp-title" x="470" y="448">Controllers</text>
  <text class="comp-desc" x="470" y="462">Handle requests, validate input, return responses</text>

  <line class="line-down" x1="470" y1="474" x2="470" y2="488"/>

  <rect class="comp" x="300" y="490" width="18" height="44"/>
  <rect class="comp" x="318" y="490" width="304" height="44"/>
  <text class="comp-title" x="470" y="508">Services</text>
  <text class="comp-desc" x="470" y="522">Business logic (loss, batch, defect rules)</text>

  <line class="line-down" x1="400" y1="534" x2="320" y2="598"/>
  <line class="line-down" x1="540" y1="534" x2="600" y2="598"/>
  <text class="label" x="350" y="572">SQL queries</text>
  <text class="label" x="585" y="572">file I/O</text>

  <rect class="tier" x="120" y="600" width="680" height="120"/>
  <rect class="tier" x="120" y="600" width="140" height="22" fill="#fff"/>
  <text class="tier-title" x="130" y="615">Data Tier</text>

  <ellipse class="db" cx="320" cy="628" rx="100" ry="14"/>
  <rect class="db" x="220" y="628" width="200" height="72"/>
  <ellipse class="db" cx="320" cy="700" rx="100" ry="14"/>
  <text class="comp-title" x="320" y="658">PostgreSQL Database</text>
  <text class="comp-desc" x="320" y="674">13 tables: users, products, batches,</text>
  <text class="comp-desc" x="320" y="686">defects, corrective_actions, logs</text>

  <rect class="comp" x="520" y="628" width="18" height="72"/>
  <rect class="comp" x="538" y="628" width="220" height="72"/>
  <text class="comp-title" x="648" y="652">Evidence File Storage</text>
  <text class="comp-desc" x="648" y="668">Uploaded defect and action photos</text>
  <text class="comp-desc" x="648" y="682">backend/uploads/evidence</text>
</svg>
