<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-label="QDTS High-Level Class Diagram">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; fill: #000; text-anchor: middle; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #000; }
      .cname { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #000; text-anchor: middle; }
      .attr { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #000; text-anchor: middle; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.2; }
      .line { fill: none; stroke: #000; stroke-width: 1; }
    </style>
  </defs>

  <text class="title" x="460" y="24">High-Level Class Diagram (Static View)  QDTS</text>

  <!-- Domain model -->
  <text class="section" x="30" y="50">Domain Model</text>
  <rect class="box" x="30" y="60" width="120" height="70"/><text class="cname" x="90" y="78">User</text><text class="attr" x="90" y="94">username, role</text>
  <rect class="box" x="170" y="60" width="120" height="70"/><text class="cname" x="230" y="78">Product</text><text class="attr" x="230" y="94">code, loss_rate</text>
  <rect class="box" x="310" y="60" width="120" height="70"/><text class="cname" x="370" y="78">Batch</text><text class="attr" x="370" y="94">batch_number, expiry</text>
  <rect class="box" x="450" y="60" width="120" height="82"/><text class="cname" x="510" y="78">Defect</text><text class="attr" x="510" y="94">defect_code, status</text><text class="attr" x="510" y="108">qty_affected</text>
  <rect class="box" x="590" y="60" width="140" height="82"/><text class="cname" x="660" y="78">CorrectiveAction</text><text class="attr" x="660" y="94">action_code, ca_status</text>
  <rect class="box" x="750" y="60" width="140" height="82"/><text class="cname" x="820" y="78">RootCauseInvestigation</text><text class="attr" x="820" y="94">root_cause_status</text>

  <line class="line" x1="150" y1="95" x2="170" y2="95"/>
  <line class="line" x1="290" y1="95" x2="310" y2="95"/>
  <line class="line" x1="430" y1="95" x2="450" y2="95"/>
  <line class="line" x1="570" y1="101" x2="590" y2="101"/>
  <line class="line" x1="570" y1="115" x2="750" y2="101"/>

  <!-- Application layer -->
  <text class="section" x="30" y="175">Application Layer</text>
  <rect class="box" x="80" y="190" width="130" height="70"/><text class="cname" x="145" y="208">AuthController</text><text class="attr" x="145" y="224">+login()</text>
  <rect class="box" x="240" y="190" width="140" height="70"/><text class="cname" x="310" y="208">DefectController</text><text class="attr" x="310" y="224">+createDefect()</text><text class="attr" x="310" y="238">+closeDefect()</text>
  <rect class="box" x="410" y="190" width="160" height="70"/><text class="cname" x="490" y="208">CorrectiveActionController</text><text class="attr" x="490" y="224">+assignAction()</text><text class="attr" x="490" y="238">+verifyAction()</text>
  <rect class="box" x="600" y="190" width="130" height="70"/><text class="cname" x="665" y="208">ReportController</text><text class="attr" x="665" y="224">+getReports()</text>
  <rect class="box" x="760" y="190" width="120" height="70"/><text class="cname" x="820" y="208">LossService</text><text class="attr" x="820" y="224">+calculateLoss()</text>

  <line class="line" x1="380" y1="260" x2="380" y2="285"/>
  <line class="line" x1="490" y1="260" x2="490" y2="285"/>
  <line class="line" x1="820" y1="260" x2="820" y2="285"/>
  <line class="line" x1="380" y1="285" x2="820" y2="285"/>
  <line class="line" x1="380" y1="285" x2="380" y2="300"/>
  <line class="line" x1="820" y1="285" x2="820" y2="300"/>

  <!-- Presentation layer -->
  <text class="section" x="30" y="320">Presentation Layer</text>
  <rect class="box" x="120" y="335" width="120" height="60"/><text class="cname" x="180" y="353">LoginPage</text>
  <rect class="box" x="270" y="335" width="120" height="60"/><text class="cname" x="330" y="353">DefectsPage</text>
  <rect class="box" x="420" y="335" width="140" height="60"/><text class="cname" x="490" y="353">DefectDetailsPage</text>
  <rect class="box" x="590" y="335" width="170" height="60"/><text class="cname" x="675" y="353">CorrectiveActionDetailsPage</text>
  <rect class="box" x="360" y="420" width="120" height="60"/><text class="cname" x="420" y="438">ApiClient</text>

  <line class="line" x1="180" y1="395" x2="420" y2="420"/>
  <line class="line" x1="330" y1="395" x2="420" y2="420"/>
  <line class="line" x1="490" y1="395" x2="420" y2="420"/>
  <line class="line" x1="675" y1="395" x2="420" y2="420"/>
  <line class="line" x1="420" y1="480" x2="420" y2="510"/>

  <!-- Data layer -->
  <text class="section" x="30" y="520">Data Layer</text>
  <rect class="box" x="300" y="535" width="360" height="70"/><text class="cname" x="480" y="560">PostgreSQL Database</text><text class="attr" x="480" y="578">users, products, batches, defects, corrective_actions, activity_logs</text>

  <line class="line" x1="145" y1="260" x2="145" y2="510"/>
  <line class="line" x1="310" y1="260" x2="310" y2="510"/>
  <line class="line" x1="490" y1="260" x2="490" y2="510"/>
  <line class="line" x1="665" y1="260" x2="665" y2="510"/>
  <line class="line" x1="145" y1="510" x2="420" y2="510"/>
  <line class="line" x1="310" y1="510" x2="420" y2="510"/>
  <line class="line" x1="490" y1="510" x2="420" y2="510"/>
  <line class="line" x1="665" y1="510" x2="420" y2="510"/>
  <line class="line" x1="420" y1="510" x2="480" y2="535"/>

</svg>
